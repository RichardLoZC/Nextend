<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>液态玻璃 · 材质示例</title><link rel="stylesheet" href="liquid-glass.css">
<style>
*{box-sizing:border-box} body{margin:0;font:16px/1.6 system-ui,sans-serif;color:#152f2a;background:radial-gradient(ellipse at 12% 20%,#f3fcdd,transparent 48%),radial-gradient(ellipse at 88% 25%,#68a6ac,transparent 58%),linear-gradient(140deg,#c9ddd6,#e6f1e8);min-height:100vh;padding:64px 24px}main{max-width:1000px;margin:auto}h1{font-size:clamp(32px,5vw,54px);letter-spacing:-.04em;line-height:1.12;margin:12px 0 20px}h2{font-size:26px;margin:0 0 12px}.eyebrow{font-size:12px;letter-spacing:.15em;font-weight:600}.intro{max-width:600px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:32px 0}.lg-panel{padding:30px}.lg-toolbar{margin:24px 0}.preview{height:100px;border-radius:18px;margin:28px 0;background:linear-gradient(125deg,#bce5d2,#47877f);border:1px solid #ffffff90}.settings{display:flex;gap:24px;flex-wrap:wrap;margin-top:30px}label{display:flex;gap:10px;align-items:center;min-height:44px}input{width:18px;height:18px}.status{min-height:52px}footer{font-size:13px;color:#405c54}@media(max-width:700px){body{padding:32px 16px}.grid{grid-template-columns:1fr}.lg-panel{padding:24px}}
</style><main><div class="eyebrow">LIQUID GLASS / REUSABLE MATERIAL</div><h1>清透，有层次。<br>内容仍然清楚。</h1><p class="intro">一个可移植的材质示例。柔和底色、明亮边缘与流动选中态共同组织界面，不需要常驻动画。</p>
<div class="settings"><label><input id="solid" type="checkbox">减少透明度</label><label><input id="dark" type="checkbox">深色材质</label></div>
<div class="grid"><section class="lg-panel"><h2>让选择自然流动</h2><p class="lg-muted">使用按钮切换偏好，也可以用 Tab 与空格操作。</p><div class="lg-toolbar" role="group" aria-label="工作偏好"><button aria-pressed="true" data-value="focus">专注</button><button aria-pressed="false" data-value="browse">浏览</button><button aria-pressed="false" data-value="share">分享</button></div><p class="status lg-muted" id="status" aria-live="polite">专注：只保留当前工作需要的内容。</p><button class="lg-button" id="reset">恢复默认偏好</button></section>
<section class="lg-panel"><h2>材质退后，内容向前</h2><p class="lg-muted">外层面板承载玻璃，内部内容保持清晰。缩小窗口或开启减少透明度，结构仍然成立。</p><div class="preview" aria-hidden="true"></div><p class="lg-muted">这是一种渐变与背景模糊的近似效果。系统原生玻璃应优先使用平台 API。</p></section></div><footer>包含减少动态效果、提高对比度、强制颜色与无背景模糊回退。配色可通过 CSS 变量替换。</footer></main>
<script src="liquid-glass.js"></script><script>const group=document.querySelector('.lg-toolbar');mountGlassToolbar(group);const text={focus:'专注：只保留当前工作需要的内容。',browse:'浏览：给信息更多空间，保持清晰层次。',share:'分享：突出需要一起讨论的内容。'};group.addEventListener('glasschange',e=>document.querySelector('#status').textContent=text[e.detail.value]);document.querySelector('#solid').addEventListener('change',e=>document.body.toggleAttribute('data-glass-solid',e.target.checked));document.querySelector('#dark').addEventListener('change',e=>document.body.dataset.glassTheme=e.target.checked?'dark':'light');document.querySelector('#reset').addEventListener('click',()=>group.querySelector('[data-value="focus"]').click());</script></html>
